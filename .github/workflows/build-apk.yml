name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate bundled client JavaScript
        run: node --check public/app.js

      - name: Verify rebuilt Scrolller client source
        run: |
          grep -q 'SearchSubredditsQuery' public/app.js
          grep -q 'pageIndex = 0' public/app.js
          grep -q 'children.iterator' public/app.js
          grep -q 'collection-link' public/app.js
          grep -q 'searchHereBtn' public/index.html
          grep -q 'categoryResults' public/index.html
          grep -q 'width:100vw' public/style.css
          grep -q 'show_login=1' android/app/src/main/java/com/scrolller/adblock/AuthBridge.java
          grep -q 'SCROLLLER_LOGIN_DEV' android/app/src/main/java/com/scrolller/adblock/AuthBridge.java
          grep -q 'Bearer ' android/app/src/main/java/com/scrolller/adblock/MediaBridge.java
          grep -q 'enterWebsiteMode' android/app/src/main/java/com/scrolller/adblock/MainActivity.java

      - name: Prepare stable debug signing key
        run: |
          base64 --decode android/app/scrolller-debug.keystore.b64 > android/app/scrolller-debug.keystore
          chmod 600 android/app/scrolller-debug.keystore
          keytool -list -keystore android/app/scrolller-debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Copy direct client into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -r public/* android/app/src/main/assets/www/

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: android

      - name: Grant Gradle execute permission
        run: chmod +x gradlew
        working-directory: android

      - name: Compile Android 16 Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Verify APK package and signatures
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi '191e5f6808941797362d844076f428cee94af60ae2929eecc70fc1c8e4da38b9' /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -20

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrolller-pro-search-collections-login-fix-android16-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
