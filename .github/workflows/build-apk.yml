name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate app JavaScript
        run: |
          node --check public/app.js
          node --check public/enhancements.js

      - name: Copy PWA Assets to Android Assets Folder
        run: |
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -r public/* android/app/src/main/assets/www/

      - name: Enable Scrolller Pro APK enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('android/app/src/main/assets/www/index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<script src="enhancements.js"></script>'
          if marker not in html:
              html = html.replace('</body>', f'    {marker}\n</body>')
          index.write_text(html, encoding='utf-8')

          activity = Path('android/app/src/main/java/com/scrolller/adblock/MainActivity.java')
          java = activity.read_text(encoding='utf-8')
          java = java.replace(
              'settings.setAllowFileAccess(true);',
              'settings.setAllowFileAccess(true);\n        settings.setAllowContentAccess(true);\n        settings.setAllowUniversalAccessFromFileURLs(true);'
          )
          java = java.replace(
              'webView.loadUrl("https://scrolller.com");',
              'webView.loadUrl("file:///android_asset/www/index.html");'
          )
          activity.write_text(java, encoding='utf-8')
          PY

      - name: Verify enhanced APK wiring
        run: |
          grep -q 'enhancements.js' android/app/src/main/assets/www/index.html
          grep -q 'file:///android_asset/www/index.html' android/app/src/main/java/com/scrolller/adblock/MainActivity.java
          grep -q 'setAllowUniversalAccessFromFileURLs(true)' android/app/src/main/java/com/scrolller/adblock/MainActivity.java
          node --check android/app/src/main/assets/www/enhancements.js

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: android

      - name: Grant Gradle execute permission
        run: chmod +x gradlew
        working-directory: android

      - name: Compile Android 16 Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Verify APK package and signatures
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -20

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrolller-pro-post-corpus-android16-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
