name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate app JavaScript
        run: |
          node --check public/app.js
          node --check public/enhancements.js
          node --check public/auth-bridge.js

      - name: Prepare stable debug signing key
        run: |
          base64 --decode android/app/scrolller-debug.keystore.b64 > android/app/scrolller-debug.keystore
          chmod 600 android/app/scrolller-debug.keystore
          keytool -list -keystore android/app/scrolller-debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Copy PWA Assets to Android Assets Folder
        run: |
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -r public/* android/app/src/main/assets/www/

      - name: Enable post corpus UI and website authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('android/app/src/main/assets/www/index.html')
          html = index.read_text(encoding='utf-8')
          for script in ('enhancements.js', 'auth-bridge.js'):
              marker = f'<script src="{script}"></script>'
              if marker not in html:
                  html = html.replace('</body>', f'    {marker}\n</body>')
          index.write_text(html, encoding='utf-8')

          # Preserve cookies from the real Scrolller website login when calling
          # Scrolller's API from the bundled client.
          app = Path('android/app/src/main/assets/www/app.js')
          js = app.read_text(encoding='utf-8')
          if "credentials: 'include'" not in js:
              js = js.replace(
                  "headers: headers,\n        body: JSON.stringify(payload)",
                  "headers: headers,\n        credentials: 'include',\n        body: JSON.stringify(payload)"
              )
          app.write_text(js, encoding='utf-8')

          activity = Path('android/app/src/main/java/com/scrolller/adblock/MainActivity.java')
          java = activity.read_text(encoding='utf-8')

          if 'private AuthBridge authBridge;' not in java:
              java = java.replace(
                  'private WebView webView;',
                  'private WebView webView;\n    private AuthBridge authBridge;'
              )

          if 'webView.addJavascriptInterface(authBridge, "NativeAuth");' not in java:
              java = java.replace(
                  'setContentView(webView);',
                  'setContentView(webView);\n\n        authBridge = new AuthBridge(this, webView);\n        webView.addJavascriptInterface(authBridge, "NativeAuth");'
              )

          java = java.replace(
              'settings.setAllowFileAccess(true);',
              'settings.setAllowFileAccess(true);\n        settings.setAllowContentAccess(true);\n        settings.setAllowUniversalAccessFromFileURLs(true);'
          )

          java = java.replace(
              'public boolean shouldOverrideUrlLoading(WebView view, String url) {\n                if (url != null) {',
              'public boolean shouldOverrideUrlLoading(WebView view, String url) {\n                if (authBridge != null && authBridge.isLoginMode()) return false;\n                if (url != null) {'
          )

          java = java.replace(
              'if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {\n                    String url = request.getUrl().toString();\n                    String host = request.getUrl().getHost();',
              'if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {\n                    if (authBridge != null && authBridge.isLoginMode()) return false;\n                    String url = request.getUrl().toString();\n                    String host = request.getUrl().getHost();',
              1
          )

          intercept_needle = 'String url = request.getUrl().toString();\n                    \n                    // Bypass anti-adblock detection checks'
          intercept_replacement = 'String url = request.getUrl().toString();\n                    if (authBridge != null && authBridge.isLoginMode()) {\n                        return super.shouldInterceptRequest(view, request);\n                    }\n                    \n                    // Bypass anti-adblock detection checks'
          java = java.replace(intercept_needle, intercept_replacement)

          java = java.replace(
              'super.onPageStarted(view, url, favicon);\n                injectCustomFilters(view);',
              'super.onPageStarted(view, url, favicon);\n                if (authBridge == null || !authBridge.isLoginMode()) injectCustomFilters(view);'
          )

          java = java.replace(
              'super.onPageFinished(view, url);\n                // Inject custom adblock filters and bypass popup script\n                injectCustomFilters(view);',
              'super.onPageFinished(view, url);\n                if (authBridge != null) authBridge.onPageFinished(url);\n                // Keep login pages untouched; apply filters only to the custom client.\n                if (authBridge == null || !authBridge.isLoginMode()) injectCustomFilters(view);'
          )

          java = java.replace(
              'webView.loadUrl("https://scrolller.com");',
              'webView.loadUrl("file:///android_asset/www/index.html");'
          )

          activity.write_text(java, encoding='utf-8')
          PY

      - name: Verify enhanced APK wiring
        run: |
          grep -q 'enhancements.js' android/app/src/main/assets/www/index.html
          grep -q 'auth-bridge.js' android/app/src/main/assets/www/index.html
          grep -q "credentials: 'include'" android/app/src/main/assets/www/app.js
          grep -q 'file:///android_asset/www/index.html' android/app/src/main/java/com/scrolller/adblock/MainActivity.java
          grep -q 'addJavascriptInterface(authBridge, "NativeAuth")' android/app/src/main/java/com/scrolller/adblock/MainActivity.java
          grep -q 'authBridge.onPageFinished(url)' android/app/src/main/java/com/scrolller/adblock/MainActivity.java
          node --check android/app/src/main/assets/www/enhancements.js
          node --check android/app/src/main/assets/www/auth-bridge.js

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: android

      - name: Grant Gradle execute permission
        run: chmod +x gradlew
        working-directory: android

      - name: Compile Android 16 Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Verify APK package and signatures
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi '191e5f6808941797362d844076f428cee94af60ae2929eecc70fc1c8e4da38b9' /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -20

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrolller-pro-post-corpus-website-login-android16-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
