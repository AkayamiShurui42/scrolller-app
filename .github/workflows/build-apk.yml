name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate bundled client JavaScript
        run: node --check public/app.js

      - name: Verify rebuilt Scrolller client source
        run: |
          grep -q 'SearchSubredditsQuery' public/app.js
          grep -q 'pageIndex = 0' public/app.js
          grep -q 'children.iterator' public/app.js
          grep -q 'collection-link' public/app.js
          grep -q 'searchHereBtn' public/index.html
          grep -q 'categoryResults' public/index.html
          grep -q 'width:100vw' public/style.css
          grep -q 'show_login=1' android/app/src/main/java/com/scrolller/adblock/AuthBridge.java
          grep -q 'SCROLLLER_LOGIN_DEV' android/app/src/main/java/com/scrolller/adblock/AuthBridge.java
          grep -q 'Bearer ' android/app/src/main/java/com/scrolller/adblock/MediaBridge.java
          grep -q 'enterWebsiteMode' android/app/src/main/java/com/scrolller/adblock/MainActivity.java

      - name: Smoke test live Scrolller search API
        run: |
          python3 - <<'PY'
          import json, urllib.request
          endpoint='https://api.scrolller.com/admin'
          ua='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          def gql(query, variables):
              body=json.dumps({'query':query,'variables':variables}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':ua})
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.loads(r.read().decode())
              if data.get('errors'): raise RuntimeError(data['errors'][0].get('message','GraphQL error'))
              return data.get('data') or {}

          search='query SearchSubredditsQuery($query:String!,$limit:Int!,$isNsfw:Boolean!,$pageIndex:Int!){searchSubreddits(data:{query:$query,isNsfw:$isNsfw,limit:$limit,pageIndex:$pageIndex}){id title url description is_nsfw item_count}}'
          result=gql(search,{'query':'walkthrough','limit':20,'isNsfw':True,'pageIndex':0}).get('searchSubreddits') or []
          assert len(result) >= 2, f'walkthrough collection search returned only {len(result)} results'
          assert any((x.get('url') or '').lower()=='walkthrough' for x in result), 'expected walkthrough collection missing from pageIndex 0'

          sub='query SubredditQuery($url:String!,$iterator:String,$sortBy:GallerySortBy,$filter:GalleryFilter,$limit:Int!){getSubreddit(data:{url:$url,iterator:$iterator,filter:$filter,limit:$limit,sortBy:$sortBy}){url title children{iterator items{id title subredditTitle subredditUrl mediaSources{url width height}}}}}'
          loaded=False
          for candidate in result:
              if candidate.get('item_count') == 0 or not candidate.get('url'): continue
              d=gql(sub,{'url':candidate['url'],'iterator':None,'sortBy':'HOT','filter':None,'limit':20})
              items=((d.get('getSubreddit') or {}).get('children') or {}).get('items') or []
              if items:
                  assert all('subredditUrl' in x for x in items[:3]), 'post collection provenance missing'
                  loaded=True
                  break
          assert loaded, 'matched collections returned no post page'

          cats='query GetCategories($is_nsfw:Boolean!){categories(data:{is_nsfw:$is_nsfw}){title}}'
          categories=gql(cats,{'is_nsfw':False}).get('categories') or []
          assert len(categories) >= 5, 'website category list unavailable'
          print('Live Scrolller search smoke test passed:',len(result),'walkthrough matches,',len(categories),'SFW categories')
          PY

      - name: Prepare stable debug signing key
        run: |
          base64 --decode android/app/scrolller-debug.keystore.b64 > android/app/scrolller-debug.keystore
          chmod 600 android/app/scrolller-debug.keystore
          keytool -list -keystore android/app/scrolller-debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Copy direct client into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -r public/* android/app/src/main/assets/www/

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: android

      - name: Grant Gradle execute permission
        run: chmod +x gradlew
        working-directory: android

      - name: Compile Android 16 Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Verify APK package and signatures
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi '191e5f6808941797362d844076f428cee94af60ae2929eecc70fc1c8e4da38b9' /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -20

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrolller-pro-search-collections-login-fix-android16-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
