name: Verify Roleplay Blocking and AI Categories

on:
  push:
    branches:
      - feat/reddit-roleplay-ai-categories
  pull_request:
    branches:
      - fix/redview-bottom-pullout-v3.9.30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test RP classifier and AI registry
        run: |
          mkdir -p /tmp/reddit-rules-test
          javac -d /tmp/reddit-rules-test \
            android/app/src/main/java/com/scrolller/adblock/CommunityContentRules.java \
            android/tests/CommunityContentRulesTest.java
          java -cp /tmp/reddit-rules-test com.scrolller.adblock.CommunityContentRulesTest
      - name: Bootstrap Android command-line SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fLSs --retry 3 --retry-delay 2 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-clt.zip
          mkdir -p /tmp/android-clt
          unzip -q /tmp/android-clt.zip -d /tmp/android-clt
          mv /tmp/android-clt/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install compile SDK
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Restore debug signing key
        run: |
          base64 --decode android/app/scrolller-debug.keystore.b64 > android/app/scrolller-debug.keystore
          chmod 600 android/app/scrolller-debug.keystore
      - name: Install Gradle 8.11.1 wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK signature
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: roleplay-ai-categories-native-source-build
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
