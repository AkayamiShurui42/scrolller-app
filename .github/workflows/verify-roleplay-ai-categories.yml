name: Verify Roleplay Blocking and AI Categories

on:
  push:
    branches:
      - feat/reddit-roleplay-ai-categories
  pull_request:
    branches:
      - fix/redview-bottom-pullout-v3.9.30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test RP classifier and AI registry
        run: |
          mkdir -p /tmp/reddit-rules-test
          javac -d /tmp/reddit-rules-test \
            android/app/src/main/java/com/scrolller/adblock/CommunityContentRules.java \
            android/tests/CommunityContentRulesTest.java
          java -cp /tmp/reddit-rules-test com.scrolller.adblock.CommunityContentRulesTest
      - name: Install Android 16 SDK using runner tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Restore debug signing key
        run: |
          base64 --decode android/app/scrolller-debug.keystore.b64 > android/app/scrolller-debug.keystore
          chmod 600 android/app/scrolller-debug.keystore
      - name: Install Gradle 8.11.1 wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK signature
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: roleplay-ai-categories-native-source-build
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
