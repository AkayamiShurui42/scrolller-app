name: Probe Scrolller Save API

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Scrolller login API
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':UA})
              with urllib.request.urlopen(r,timeout=30) as x:return x.read().decode('utf-8','replace')
          html=get('https://scrolller.com/')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          needles=['loginUser','logInUser','loginMutation','mutation Login','signIn','LogIn','login(data','password','username']
          for src in srcs:
              url=urllib.parse.urljoin('https://scrolller.com/',src)
              try: js=get(url)
              except Exception: continue
              if not any(n in js for n in needles): continue
              print('\n===',url,'===')
              for n in needles:
                  start=0; count=0
                  while True:
                      p=js.find(n,start)
                      if p<0 or count>=6: break
                      text=js[max(0,p-1800):p+4400].replace('\n',' ')
                      if 'graphQLQuery' in text or 'mutation' in text.lower() or 'login' in text.lower():
                          print('\nTERM',n,'\n',text[:6200])
                      start=p+len(n); count+=1
          PY
