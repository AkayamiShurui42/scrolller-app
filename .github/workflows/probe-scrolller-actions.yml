name: Probe Scrolller Save API

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate add-to-collection mutation field
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          endpoint='https://api.scrolller.com/admin'
          q='mutation AddPostToCollection($postId:Int!,$collectionId:Int!){addPostToCollection(data:{postId:$postId,collectionId:$collectionId})}'
          body=json.dumps({'query':q,'variables':{'postId':0,'collectionId':0}}).encode()
          req=urllib.request.Request(endpoint,data=body,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read().decode()
          except urllib.error.HTTPError as e:
              raw=e.read().decode()
          print(raw)
          data=json.loads(raw or '{}')
          text=' '.join(str(x.get('message','')) for x in (data.get('errors') or []))
          assert 'Cannot query field' not in text, text
          assert 'Unknown argument' not in text, text
          assert 'Unknown type' not in text, text
          print('Mutation schema accepted; resolver/auth error is expected without a session.')
          PY
