name: Probe Scrolller Save API

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Scrolller bundles for save and collection APIs
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':UA})
              with urllib.request.urlopen(r,timeout=30) as x:return x.read().decode('utf-8','replace')
          html=get('https://scrolller.com/')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          terms=['addPostToCollection','removePostFromCollection','createCollection','AddPostToCollection','RemovePostFromCollection','getUserCollections','userCollectionQuery','savePost','favorite','bookmark','collectionId','postId']
          for src in srcs:
              url=urllib.parse.urljoin('https://scrolller.com/',src)
              try: js=get(url)
              except Exception: continue
              hits=[t for t in terms if t in js]
              if not hits: continue
              print('\n===',url,'===')
              for t in hits:
                  p=js.find(t)
                  print('\nTERM',t,'\n',js[max(0,p-1200):p+3200].replace('\n',' ')[:4400])
          PY
