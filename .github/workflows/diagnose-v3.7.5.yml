name: Diagnose Reddit Media v3.7.5

on:
  push:
    branches:
      - reddit-native-redview-v3.7.5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reddit-media-v3.7.5-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture v3.7.5 compiler diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply source patch stack
        working-directory: android
        run: |
          python3 patches/apply_v3_3.py
          python3 patches/apply_v3_4.py
          python3 patches/apply_v3_4_stream.py
          python3 patches/apply_v3_5.py
          python3 patches/apply_v3_5_1_loading.py
          python3 patches/apply_v3_5_2_texture_surface.py
          python3 patches/apply_v3_5_3_back_dispatcher.py
          python3 patches/apply_v3_6_read_hide.py
          python3 patches/apply_v3_6_favorites_protection.py
          python3 patches/apply_v3_6_1_stable_pager.py
          python3 patches/apply_v3_6_1_immediate_mark.py
          python3 patches/apply_v3_6_2_loading_ready_hidden_manage.py
          python3 patches/apply_v3_6_3_persistent_fullscreen_overlay.py
          python3 patches/apply_v3_6_4_single_owner_overlay.py
          python3 patches/apply_v3_6_5_preloaded_tap_toggle_overlay.py
          python3 patches/apply_v3_6_6_search_subscribe.py
          python3 patches/apply_v3_6_7_reservoir.py
          python3 patches/apply_v3_6_7_redgifs_post.py
          python3 patches/apply_v3_6_7_redgifs_resolver.py
          python3 patches/apply_v3_6_7_hq_player.py
          python3 patches/apply_v3_6_7_pager_media.py
          python3 patches/apply_v3_6_7_grid_media.py
          python3 patches/apply_v3_6_8_scrolller_source.py
          python3 patches/apply_v3_6_9_unread_content_filters.py
          python3 patches/apply_v3_6_9_filters_saved_state.py
          python3 patches/apply_v3_6_9_saved_immediate_performance.py
          python3 patches/apply_v3_7_3_search_scopes_compatible.py
          python3 patches/apply_v3_7_0_historical_access.py
          python3 patches/apply_v3_7_1_quality_crawl.py
          python3 patches/apply_v3_7_1_import_fix.py
          python3 patches/apply_v3_7_2_quality_browse.py
          python3 patches/apply_v3_7_3_feed_search_stability.py
          python3 patches/apply_v3_7_3_generated_structure_fix.py
          python3 patches/apply_v3_7_3_generated_append_fix.py
          python3 patches/apply_v3_7_4_final.py
          python3 patches/apply_v3_7_5_subreddit_search.py
          python3 patches/apply_v3_7_5_category_folders.py
          python3 patches/apply_v3_7_5_search_index_home_random_final.py
          python3 patches/apply_v3_7_5_generated_structure_cleanup.py
          python3 patches/apply_v3_7_5_generated_method_reconstruction.py
          python3 patches/apply_v3_7_5_restore_read_hide_helpers.py
          python3 patches/apply_v3_7_5_runtime_reliability_custom_categories.py
          python3 patches/apply_v3_7_5_runtime_structure_fix.py

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1

      - name: Compile and capture diagnostics
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/v375-gradle-build.log
          status=${PIPESTATUS[0]}
          echo "=== FIRST JAVA ERRORS ===" | tee /tmp/v375-first-errors.txt
          grep -n -m 40 -E 'MainActivity\.java:|RedditPost\.java:|error:|cannot find symbol|incompatible types|method .* cannot be applied' /tmp/v375-gradle-build.log | tee -a /tmp/v375-first-errors.txt || true
          exit "$status"

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3.7.5-compiler-diagnostics
          path: |
            /tmp/v375-gradle-build.log
            /tmp/v375-first-errors.txt
          if-no-files-found: error
          retention-days: 3
