name: Probe Scrolller API

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current website bundles
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':UA})
              with urllib.request.urlopen(r,timeout=30) as x:return x.read().decode('utf-8','replace')
          html=get('https://scrolller.com/')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          terms=['SearchCollectionsQuery','searchCollections','getCollection(data','query GetCollection','getCollection(','getCategorySubreddits','GetCategorySubreddits','signIn','login','Log in','Sign in']
          for src in srcs:
              url=urllib.parse.urljoin('https://scrolller.com/',src)
              try: js=get(url)
              except Exception: continue
              found=[t for t in terms if t in js]
              if not found: continue
              print('\n===',url,'===')
              for t in found:
                  p=js.find(t)
                  print('\nTERM',t,'\n',js[max(0,p-900):p+2600].replace('\n',' ')[:3500])
          PY
