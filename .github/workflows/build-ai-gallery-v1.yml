name: Build AI Gallery v1.0.0

on:
  push:
    branches:
      - feat/ai-nsfw-gallery-v1
    paths:
      - 'android/**'
      - '.github/workflows/build-ai-gallery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-gallery-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: feat/ai-nsfw-gallery-v1

      - name: Validate AI Gallery invariants
        run: |
          MAIN=android/app/src/main/java/com/scrolller/adblock/AiGalleryActivity.java
          SRC=android/app/src/main/java/com/scrolller/adblock/AdultImageSourceClient.java
          STORE=android/app/src/main/java/com/scrolller/adblock/AdultLibraryStore.java
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'applicationId "com.crimson.aigallery"' android/app/build.gradle
          grep -q 'versionCode 1' android/app/build.gradle
          grep -q 'versionName "1.0.0"' android/app/build.gradle
          grep -q 'android:name=".AiGalleryActivity"' "$MANIFEST"
          grep -q 'android:label="AI Gallery"' "$MANIFEST"
          grep -q 'Search prompt / tags' "$MAIN"
          grep -q 'AdultImageSourceClient.Source.RULE34' "$MAIN"
          grep -q 'AdultImageSourceClient.Source.GELBOORU' "$MAIN"
          grep -q 'image set' "$SRC"
          grep -q 'rating:explicit' "$SRC"
          grep -q 'ai_generated' "$SRC"
          grep -q 'BLOCKED_TAGS' "$SRC"
          grep -q 'setSavedAsync' "$STORE"
          grep -q 'setHiddenAsync' "$STORE"
          grep -q 'setViewedAsync' "$STORE"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Use runner Android SDK
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          test -d "$ANDROID_SDK"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare stable debug key
        run: |
          base64 --decode android/app/scrolller-debug.keystore.b64 > android/app/scrolller-debug.keystore
          chmod 600 android/app/scrolller-debug.keystore

      - name: Compile app
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.crimson.aigallery'" /tmp/badging.txt
          grep -q "versionCode='1'" /tmp/badging.txt
          grep -q "versionName='1.0.0'" /tmp/badging.txt
          mkdir -p dist
          cp "$APK" dist/AI-Gallery-v1.0.0-debug.apk

      - name: Upload AI Gallery APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-gallery-v1.0.0-debug-apk
          path: dist/AI-Gallery-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
