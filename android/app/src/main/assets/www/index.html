<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Scrolller Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon" id="backBtn" aria-label="Back">‹</button>
    <div class="brand">Scrolller <b>Pro</b></div>
    <button class="icon" id="filterBtn" aria-label="Filters">☷</button>
  </header>

  <div class="source-strip" id="sourceStrip">
    <button data-source="ALL" class="active">All</button>
    <button data-source="SCROLLLER">Scrolller</button>
    <button data-source="REDDIT">Reddit</button>
    <button data-source="REDGIFS">RedGIFs</button>
  </div>

  <main id="feed" class="feed"></main>
  <div id="empty" class="empty hidden">No media matched this search and filter set.</div>
  <div id="busy" class="busy hidden">Loading…</div>

  <nav class="bottom-nav">
    <button id="feedBtn" class="active">Feed</button>
    <button id="searchBtn">Search</button>
    <button id="collectionsBtn">Collections</button>
  </nav>
</div>

<section id="searchSheet" class="sheet hidden">
  <div class="sheet-card">
    <div class="sheet-head"><b>Search</b><button data-close>×</button></div>
    <div class="segmented" id="scopeSwitch">
      <button data-scope="POSTS" class="active">Posts</button>
      <button data-scope="COLLECTIONS">Collections</button>
    </div>
    <form id="searchForm" class="search-row">
      <input id="searchInput" placeholder="Search all media or collections" autocomplete="off">
      <button type="submit">Go</button>
    </form>
    <div id="searchResults" class="results"></div>
  </div>
</section>

<section id="filterSheet" class="sheet hidden">
  <div class="sheet-card">
    <div class="sheet-head"><b>Sort & Filters</b><button data-close>×</button></div>
    <label>Sort<select id="sortSelect"><option value="HOT">Best</option><option value="NEW">Newest</option><option value="TOP">Top</option><option value="RANDOM">Random</option></select></label>
    <label>Media<select id="mediaSelect"><option value="ALL">All</option><option value="IMAGE">Images</option><option value="VIDEO">Videos</option><option value="GIF">GIFs</option><option value="ALBUM">Albums</option></select></label>
    <label>Category<select id="categorySelect"><option value="ALL">All categories</option></select></label>
    <label>Content<select id="nsfwSelect"><option value="ALL">All</option><option value="SFW">SFW</option><option value="NSFW">NSFW</option></select></label>
    <button id="applyFilters" class="primary">Apply</button>
    <button id="loginBtn" class="secondary">Sign in to Scrolller</button>
  </div>
</section>

<section id="collectionsSheet" class="sheet hidden">
  <div class="sheet-card">
    <div class="sheet-head"><b>Collections</b><button data-close>×</button></div>
    <div class="search-row"><input id="collectionQuery" placeholder="Search all collections"><button id="collectionSearchBtn">Go</button></div>
    <button id="myCollectionsBtn" class="secondary">My Scrolller collections</button>
    <div id="collectionResults" class="results"></div>
  </div>
</section>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
