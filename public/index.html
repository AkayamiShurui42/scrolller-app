<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="no-referrer">
  <title>Scrolller Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="backBtn" class="round-btn" aria-label="Back">‹</button>
    <button id="titleBtn" class="title-pill" aria-label="Current feed">Scrolller</button>
    <div class="top-actions">
      <button id="searchBtn" class="round-btn" aria-label="Search">⌕</button>
      <button id="filterBtn" class="round-btn" aria-label="Filters">☰</button>
      <button id="accountBtn" class="round-btn account-dot" aria-label="Account">●</button>
    </div>
  </header>

  <main id="feed" class="feed" aria-live="polite"></main>
  <div id="busy" class="status-pill hidden">Loading…</div>
  <div id="empty" class="empty hidden">No posts matched this view.</div>

  <nav class="dock" aria-label="Primary navigation">
    <button id="feedBtn" class="active">Feed</button>
    <button id="collectionsBtn">Collections</button>
    <button id="randomBtn">Random</button>
  </nav>
</div>

<section id="searchSheet" class="sheet hidden" aria-modal="true">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><b>Search</b><button data-close>×</button></div>
    <div class="segmented" id="scopeSwitch">
      <button data-scope="POSTS" class="active">Posts</button>
      <button data-scope="COLLECTIONS">Collections</button>
    </div>
    <div id="searchContext" class="context-row hidden">
      <span id="searchContextLabel">Search in this collection</span>
      <div class="mini-segmented">
        <button id="searchHereBtn" class="active" type="button">This collection</button>
        <button id="searchEverywhereBtn" type="button">All Scrolller</button>
      </div>
    </div>
    <form id="searchForm" class="search-row">
      <input id="searchInput" placeholder="Search Scrolller" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <div id="searchResults" class="results"></div>
  </div>
</section>

<section id="filterSheet" class="sheet hidden" aria-modal="true">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><b>Feed options</b><button data-close>×</button></div>
    <div class="filter-grid">
      <label>Sort<select id="sortSelect"><option value="HOT">Best</option><option value="NEW">Newest</option><option value="TOP">Top</option><option value="RANDOM">Random</option></select></label>
      <label>Media<select id="mediaSelect"><option value="ALL">All</option><option value="IMAGE">Images</option><option value="VIDEO">Videos</option><option value="GIF">GIFs</option><option value="ALBUM">Albums</option></select></label>
      <label>Category<select id="categorySelect"><option value="ALL">All categories</option></select></label>
      <label>Content<select id="nsfwSelect"><option value="ALL">All</option><option value="SFW">SFW</option><option value="NSFW">NSFW</option></select></label>
    </div>
    <button id="applyFilters" class="primary wide">Apply</button>
  </div>
</section>

<section id="collectionsSheet" class="sheet hidden" aria-modal="true">
  <div class="sheet-card collections-card">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><b>Collections</b><button data-close>×</button></div>
    <div class="search-row"><input id="collectionQuery" placeholder="Search every Scrolller collection"><button id="collectionSearchBtn">Search</button></div>
    <button id="myCollectionsBtn" class="secondary wide">My collections</button>
    <div class="section-label">Website categories</div>
    <div id="categoryResults" class="category-chips"><span class="muted">Loading categories…</span></div>
    <div id="collectionResults" class="results"></div>
  </div>
</section>

<section id="accountSheet" class="sheet hidden" aria-modal="true">
  <div class="sheet-card account-card">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><b>Scrolller account</b><button data-close>×</button></div>
    <div id="accountStatus" class="account-status">Checking sign-in…</div>
    <button id="loginBtn" class="primary wide">Sign in to Scrolller</button>
    <p class="hint">Sign-in opens Scrolller only for authentication. Android Back returns to the native feed afterward.</p>
  </div>
</section>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
